
name: Build GTOpen Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout GTOpen
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crates
            web
          sparse-checkout-cone-mode: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GTOpen with GPU
        run: cargo build --release -p server --features gpu

      - name: Package GTOpen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target/release/gto-server.exe package/
          Copy-Item web package/web -Recurse

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GTOpen-Windows-GPU
          path: package/
          if-no-files-found: error
